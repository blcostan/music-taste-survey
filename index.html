<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicPulse — Global Music Taste & Demographics Survey</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for Data Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar and subtle transitions */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .genre-checkbox:checked + label {
            background-color: #7c3aed;
            color: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.39);
            transform: translateY(-1px);
        }
        .dark .genre-checkbox:checked + label {
            background-color: #8b5cf6;
            border-color: #8b5cf6;
            box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.35);
        }
        .glass-card {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @keyframes pulse-eq {
            0%, 100% { height: 6px; }
            50% { height: 18px; }
        }
        .eq-bar:nth-child(1) { animation: pulse-eq 0.9s ease-in-out infinite; }
        .eq-bar:nth-child(2) { animation: pulse-eq 0.6s ease-in-out infinite 0.2s; }
        .eq-bar:nth-child(3) { animation: pulse-eq 1.1s ease-in-out infinite 0.1s; }
        .eq-bar:nth-child(4) { animation: pulse-eq 0.7s ease-in-out infinite 0.3s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container (Replaces alert) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 glass-card">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Brand Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-fuchsia-500 flex
